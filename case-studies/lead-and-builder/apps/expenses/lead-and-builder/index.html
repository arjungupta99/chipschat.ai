<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ec">
  <title>Split — shared expenses</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>

  <main id="view" class="view"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Delete?</h2>
    <p id="confirm-message"></p>
    <div class="confirm-actions">
      <button type="button" id="confirm-cancel" class="btn ghost">Cancel</button>
      <button type="button" id="confirm-ok" class="btn danger">Delete</button>
    </div>
  </dialog>

  <script src="money.js"></script>
  <script src="app.js"></script>
</body>
</html>
